{% extends "admin/admin_base.html" %}
{% block title %}修改密码{% endblock %}

{% block content %}
<h1>修改密码</h1>

<form method="post" action="/admin/change-password" class="password-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-group">
        <label for="currentPassword">当前密码 <span class="required">*</span></label>
        <input type="password" id="currentPassword" name="current_password" required
               autocomplete="current-password">
        <p class="form-hint">必须先验证当前密码，才能修改密码。</p>
    </div>

    <div class="form-group">
        <label for="newPassword">新密码 <span class="required">*</span></label>
        <input type="password" id="newPassword" name="new_password" required minlength="12"
               autocomplete="new-password">
        <p class="form-hint">
            至少 12 个字符（UTF-8 不超过 72 字节），不能全部为空格或简单重复，
            并会拦截常见弱密码。修改成功后，其他已登录设备的会话将立即失效。
        </p>
    </div>

    <div class="form-group">
        <label for="confirmPassword">确认新密码 <span class="required">*</span></label>
        <input type="password" id="confirmPassword" name="confirm_password" required minlength="12"
               autocomplete="new-password">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">修改密码</button>
    </div>
</form>
{% endblock %}
