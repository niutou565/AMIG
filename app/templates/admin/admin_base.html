<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}后台管理{% endblock %} - {{ site_name }}</title>
    <meta name="theme-color" content="#0b0b0d">
    <link rel="stylesheet" href="/static/css/dark.css?v=3">
    <link rel="stylesheet" href="/static/css/admin.css?v=3">
    <style>:root { --accent: {{ accent_color | safe_color }}; }</style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-brand">
                <a href="/admin/dashboard">{{ site_name }}</a>
                <span class="sidebar-sub">管理后台</span>
            </div>
            <nav class="sidebar-nav" aria-label="后台导航">
                <a href="/admin/dashboard" class="{% if request.url.path == '/admin/dashboard' %}active{% endif %}">仪表盘</a>
                <a href="/admin/review" class="{% if request.url.path.startswith('/admin/review') %}active{% endif %}">图片审核</a>
                <a href="/admin/images" class="{% if request.url.path.startswith('/admin/images') %}active{% endif %}">图片管理</a>
                <a href="/admin/users" class="{% if request.url.path == '/admin/users' %}active{% endif %}">用户/IP 管理</a>
                <a href="/admin/links" class="{% if request.url.path == '/admin/links' %}active{% endif %}">友情链接</a>
                <a href="/admin/pages" class="{% if request.url.path.startswith('/admin/pages') %}active{% endif %}">页面管理</a>
                <a href="/admin/settings" class="{% if request.url.path == '/admin/settings' %}active{% endif %}">站点设置</a>
                <a href="/admin/logs" class="{% if request.url.path == '/admin/logs' %}active{% endif %}">操作日志</a>
                <a href="/admin/change-password" class="{% if request.url.path == '/admin/change-password' %}active{% endif %}">修改密码</a>
            </nav>
            <div class="sidebar-footer">
                <span>{{ admin.username }}</span>
                <form method="post" action="/admin/logout" class="logout-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit">退出登录</button>
                </form>
            </div>
            <div class="sidebar-version">{{ app_name }} {{ app_version }}</div>
        </aside>

        <div class="sidebar-overlay" id="adminOverlay" hidden></div>

        <div class="admin-shell">
            <header class="admin-topbar">
                <button type="button" class="admin-nav-toggle" id="adminNavToggle"
                        aria-controls="adminSidebar" aria-expanded="false" aria-label="打开菜单">&#9776;</button>
                <a href="/admin/dashboard" class="admin-topbar-brand">{{ site_name }}</a>
                <form method="post" action="/admin/logout" class="topbar-logout">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit">退出</button>
                </form>
            </header>
            <main class="admin-main">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="/static/js/admin.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
