{% extends "admin/admin_base.html" %}
{% block title %}修改密码{% endblock %}

{% block content %}
<h1>修改密码</h1>

{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
{% if success %}<div class="alert alert-success" role="status">{{ success }}</div>{% endif %}

<form method="post" action="/admin/change-password" class="password-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-group">
        <label for="newPassword">新密码 <span class="required">*</span></label>
        <input type="password" id="newPassword" name="new_password" required minlength="6"
               autocomplete="new-password">
        <p class="form-hint">至少 6 位。修改成功后，其他已登录设备的会话将立即失效。</p>
    </div>

    <div class="form-group">
        <label for="confirmPassword">确认新密码 <span class="required">*</span></label>
        <input type="password" id="confirmPassword" name="confirm_password" required minlength="6"
               autocomplete="new-password">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">修改密码</button>
    </div>
</form>
{% endblock %}
